  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 40px;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .main-text {
      display: flex;
      flex-direction: column;
      gap: 0;
      align-self: flex-start;
    }

    .portfolio {
      display: flex;
      flex-direction: column;
      gap: 48px;
      align-self: flex-start;
    }

    .portfolio-item {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 16px;
      color: inherit;
      text-decoration: none;
      transition: opacity 0.2s;
      width: fit-content;
    }

    .portfolio-item:hover {
      opacity: 0.7;
    }

    .portfolio-preview {
      width: 240px;
      height: 240px;
      object-fit: cover;
      display: block;
    }

    .portfolio-title {
      font-size: 48px;
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: -0.02em;
      text-align: left;
    }

    .social-icon {
      width: 24px;
      height: 24px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 1.5;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .social-icon:hover {
      opacity: 0.7;
    }

    .social-icon.email {
      stroke: #ffffff;
      fill: none;
    }

    .social-link {
      display: inline-block;
      text-decoration: none;
      color: inherit;
    }

    .social-icons {
      display: inline-flex;
      gap: 26px;
      align-items: center;
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 36px;
      gap: 40px;
    }

    .legal-links {
      display: flex;
      gap: 24px;
      justify-content: flex-end;
      text-align: right;
      font-size: 12px;
      letter-spacing: -0.01em;
      text-transform: lowercase;
    }

    .legal-links a {
      color: #ffffff;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .legal-links a:hover {
      opacity: 0.7;
    }

    .book-call {
      display: inline-block;
      color: #ffffff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 400;
      letter-spacing: -0.02em;
      transition: opacity 0.2s;
      cursor: pointer;
      line-height: 24px;
    }

    .book-call:hover {
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      body {
        padding: 24px;
      }

      .portfolio-title {
        font-size: 36px;
      }

      .portfolio-preview {
        width: 180px;
        height: 180px;
      }

      .social-icons {
        gap: 20px;
      }

      .social-icon {
        width: 20px;
        height: 20px;
      }

      .book-call {
        font-size: 16px;
        line-height: 20px;
      }

      .footer-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 24px;
      }

      .legal-links {
        flex-wrap: wrap;
        justify-content: flex-start;
        gap: 12px;
        text-align: left;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="content">
    <div class="portfolio">
      <a class="portfolio-item" href="/books/">
        <img class="portfolio-preview" src="what-book.jpg" alt="" width="240" height="240">
        <span class="portfolio-title">what book should I read next?</span>
      </a>
    </div>

    <div class="footer-row">
      <div class="social-icons">
        <a href="mailto:isauraconsulting@gmail.com" class="social-link">
          <svg class="social-icon email" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="5" width="18" height="14" rx="2" ry="2"/>
            <path d="M3 7l9 6 9-6"/>
          </svg>
        </a>
        <a href="https://www.linkedin.com/in/isaurasantos/" target="_blank" rel="noopener noreferrer" class="social-link">
          <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2z"/>
            <circle cx="4" cy="4" r="2"/>
          </svg>
        </a>
        <a href="https://www.instagram.com/isauramusic/" target="_blank" rel="noopener noreferrer" class="social-link">
          <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="1.5"/>
          </svg>
        </a>
        <a href="https://tidycal.com/isaurasantos/30-minute-meeting-with-isaura" target="_blank" rel="noopener noreferrer" class="book-call">book a call</a>
        <a href="/twnya/" class="book-call">creative mentorship</a>
      </div>
      <div class="legal-links">
        <a href="/privacy.html">privacy policy</a>
        <a href="/cookie-policy.html">cookie policy</a>
        <a href="/legal-notice.html">legal notice</a>
      </div>
    </div>
  </div>
</body>
</html>
