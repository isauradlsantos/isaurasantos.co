  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 40px;
      overflow-x: clip;
    }

    a {
      color: inherit;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    a:hover {
      opacity: 0.7;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    .page-header {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 32px;
    }

    .page-header.is-hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .home-link {
      display: inline-block;
      line-height: 0;
    }

    .site-link {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 24px;
      text-transform: lowercase;
      white-space: nowrap;
    }

    .portrait-thumb {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 20%;
      display: block;
      transition: opacity 0.2s;
    }

    .home-link:hover .portrait-thumb {
      opacity: 0.7;
    }

    .page-body {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: clamp(48px, 8vw, 96px);
      width: 100%;
      max-width: 100%;
      margin-top: -1cm;
    }

    .main-text {
      display: flex;
      flex-direction: column;
      gap: 0;
      flex: 0 0 auto;
      min-width: 0;
      max-width: 100%;
    }

    .main-text h1 {
      font-size: clamp(28px, 3.6vw, 48px);
      font-weight: 400;
      line-height: 1.4;
      margin: 0;
      letter-spacing: -0.02em;
      text-align: left;
    }

    .main-text button {
      background: none;
      border: none;
      color: inherit;
      font: inherit;
      letter-spacing: inherit;
      text-align: left;
      cursor: pointer;
      padding: 0;
      transition: opacity 0.2s;
      white-space: normal;
      max-width: 100%;
    }

    .main-text button:hover {
      opacity: 0.7;
    }

    .main-text.has-selection button:not(.is-active) {
      opacity: 0.35;
    }

    .main-text.has-selection button.is-active {
      opacity: 1;
    }

    .main-text.has-selection button:not(.is-active):hover {
      opacity: 0.55;
    }

    .right-side {
      flex: 0 0 auto;
      width: min(580px, 100%);
      max-width: 580px;
      min-width: 0;
    }

    .content-panel {
      display: none;
      width: 100%;
      max-width: 100%;
      margin-bottom: 48px;
      overflow-wrap: anywhere;
    }

    .content-panel.is-visible {
      display: block;
    }

    .content-panel p {
      font-size: 20px;
      font-weight: 400;
      line-height: 1.5;
      letter-spacing: -0.02em;
      margin-bottom: 1.2em;
      overflow-wrap: anywhere;
    }

    .content-panel p:last-child {
      margin-bottom: 0;
    }

    .action-box {
      position: sticky;
      top: 40px;
      width: 100%;
      max-width: 100%;
      overflow-wrap: anywhere;
      font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Monaco, Consolas, 'Liberation Mono', monospace;
      font-size: 12px;
      line-height: 1.6;
      letter-spacing: 0;
    }

    .action-box.is-hidden {
      display: none;
    }

    .action-box h3 {
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0;
      text-transform: lowercase;
      margin-bottom: 1.2em;
    }

    .action-box p {
      margin-bottom: 1.2em;
    }

    .action-box p:last-child {
      margin-bottom: 0;
    }

    .action-box a.email-highlight {
      color: #ffffff;
      text-decoration: none;
      box-shadow: inset 0 -0.32em 0 rgba(255, 220, 0, 0.45);
      transition: box-shadow 0.2s;
    }

    .action-box a.email-highlight:hover {
      opacity: 1;
      box-shadow: inset 0 -0.32em 0 rgba(255, 220, 0, 0.7);
    }

    .footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 36px;
      gap: 40px;
    }

    .social-icons {
      display: inline-flex;
      gap: 26px;
      align-items: center;
      flex-wrap: wrap;
    }

    .social-icon {
      width: 24px;
      height: 24px;
      stroke: #ffffff;
      fill: none;
      stroke-width: 1.5;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .social-icon:hover {
      opacity: 0.7;
    }

    .social-link {
      display: inline-block;
      text-decoration: none;
      color: inherit;
    }

    .book-call {
      display: inline-block;
      color: #ffffff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 400;
      letter-spacing: -0.02em;
      transition: opacity 0.2s;
      cursor: pointer;
      line-height: 24px;
    }

    .book-call:hover {
      opacity: 0.7;
    }

    .footer-right {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .legal-links {
      display: flex;
      gap: 24px;
      justify-content: flex-end;
      text-align: right;
      font-size: 12px;
      letter-spacing: -0.01em;
      text-transform: lowercase;
    }

    .legal-links a {
      color: #ffffff;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .legal-links a:hover {
      opacity: 0.7;
    }

    @media (max-width: 900px) {
      body {
        padding: 28px;
      }

      .right-side {
        flex: 1 1 100%;
        width: 100%;
        max-width: 580px;
      }

      .action-box {
        position: static;
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 24px;
      }

      .main-text h1 {
        font-size: 36px;
      }

      .content-panel p {
        font-size: 18px;
      }

      .social-icons {
        gap: 20px;
      }

      .social-icon {
        width: 20px;
        height: 20px;
      }

      .book-call {
        font-size: 16px;
        line-height: 20px;
      }

      .footer-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 24px;
      }

      .footer-right {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }

      .legal-links {
        flex-wrap: wrap;
        justify-content: flex-start;
        gap: 12px;
        text-align: left;
      }
    }
  </style>

<body>

            <path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2z"/>

  </div>
  <script>
    var email = 'isauramusic@gmail.com';
    var activeSectionId = null;

    var copy = {
      description: 'A project collecting the stories of people whose lives were forever changed by a diagnosis.',
      sections: [
          {
            id: 'my-story',
            nav: 'my story after a diagnosis',
            paragraphs: [
              'I was diagnosed with breast cancer at 30, in January 2020. Today, roughly six years later, something I can tell you is that I am a very different person. I\'ve become new things, some of them incredibly beautiful and ones I\'m proud of, but I also carry overwhelming health anxiety — I\'m afraid, petrified of things that used to be trivial, which is really taxing. A follow-up exam is now emotionally draining. Minor symptoms set off an entire cascade of "what ifs," as if I\'ve lost trust in my own body, and I\'m always vigilant, overanalyzing every tingle. Very few things can truly shield me from this — and it\'s not for lack of positivity, information, or even faith. It\'s the consequence of traumatic life experiences, the aftertaste of life-and-death situations that resurfaces as I dare to go back to living in what used to be my normal.',
              'You see, when you\'re doing treatments and going to your appointments, it can feel like a structure — doctors, nurses, the hospital — is taking care of you, and you decide to trust the process. Then comes the moment of having to "graduate" and trust that you\'ll be fine. But when you go back to your life, you no longer fit; you\'re different now, and you have a new normal to figure out.'
            ]
          },
          {
            id: 'not-just-me',
            nav: 'it\'s not just me',
            paragraphs: [
              'This is a very rudimentary summary of the multitude of new challenges I was left with, but the key point is this: I now know that nobody — patient, physician, or system — truly knows how to deal with, overcome, or ease these challenges. Even more important, I finally understood that this isn\'t specific to me, and I\'m not the only one feeling it. It seems that when people face certain diagnoses — chronic and autoimmune diseases, strokes, transplants, genetic therapy, intensive treatments, and of course cancer — these challenges appear. The timeline in which they develop isn\'t clear, and I\'m not a psychologist, but I can give you my own example and tell you that at the six-year post-diagnosis mark, I\'m struggling the most.'
            ]
          },
          {
            id: 'what-needs-to-change',
            nav: 'what needs to change',
            paragraphs: [
              'I\'m incredibly, immeasurably grateful for all the care I received and keep receiving. The world is optimized for getting things done, for getting people out of the acute, threatening phase of their illnesses — but the challenges don\'t end there. Quality of life isn\'t just about dying or surviving; it\'s about enjoying each day. And on this point, the conversation needs to be bigger, and much louder.',
              'What can we learn from each other? What does this all mean to other people? What does it mean to be more gentle with people whose lives have been forever changed by illness? And how would those findings impact the processes we don\'t question — such as waiting for days, even weeks, for a call from the hospital to schedule a follow-up, when you\'re someone who\'s unlearned how to make simple plans? What is this waiting doing to us emotionally, and what is the impact of this nerve-wracking ritual on our clinical outcomes? Could we help the people in charge better understand our side of the story?'
            ]
          },
          {
            id: 'why-not-music',
            nav: 'why not music for this',
            paragraphs: [
              'Whenever I\'m going through something meaningful, I turn to art. Music has been my medium to express the joy of living, but also the doubts, the concerns, the uncertainties, the desperations. But this challenge got so big that I felt unable to make music from it. Eventually I understood it was simply that I might need a different form of expression — and the idea of writing my story started taking form.',
              'But this is so much bigger and more important than an n of 1. This is the reality of too many, and I should try to tell as many stories as possible.'
            ]
          },
          {
            id: 'tell-your-story',
            nav: 'tell me your story',
            paragraphs: [
              'I\'m not really sure what the final form of all this will be, but I\'ve decided to have conversations with people facing similar challenges, collect what they share, and tell our collective story. Because I want to believe we can build a world that is a bit more caring for anyone, in any season of life.',
              'So if your life split into a before and an after because of a diagnosis, and you\'re now living in the after, I\'d like to hear from you. Cancer, stroke, transplant, a chronic or autoimmune condition, intensive treatment. Or you were the person beside someone going through it.',
              'You don\'t need a diagnosis people recognize, and you don\'t need to have made peace with it. I want the honest version, not the inspirational one. If you\'re thinking "my story isn\'t big enough," that\'s exactly the one I want to hear.',
              'Write to me at isauramusic@gmail.com. A few lines is enough to start: what happened, what changed afterward, and whether you\'d be open to a conversation.',
              'Everything stays between us. I only share what you\'re okay with. I read every email, and I\'ll reach out after the summer, in Portuguese or English.'
            ]
          }
        ],
        actionBox: {
          title: 'tell me your story',
          blocks: [
            { type: 'p', text: 'Anyone whose life split into a before and an after because of a diagnosis, and who\'s now living in the after. Cancer, stroke, transplant, a chronic or autoimmune condition, intensive treatment. Or you were the person beside someone going through it.' },
            { type: 'p', text: 'You don\'t need a diagnosis people recognize, and you don\'t need to have made peace with it. I want the honest version, not the inspirational one. If you\'re thinking "my story isn\'t big enough," that\'s exactly the one I want to hear.' },
            { type: 'email', before: 'Write to me at ', after: '' },
            { type: 'p', text: 'A few lines is enough to start: what happened, what changed afterward, and whether you\'d be open to a conversation.' },
            { type: 'p', text: 'Everything stays between us. I only share what you\'re okay with. I read every email, and I\'ll reach out after the summer, in Portuguese or English.' }
          ]
        }
    };

    function renderParagraphs(paragraphs) {
      return paragraphs.map(function (text) {
        return '<p>' + text + '</p>';
      }).join('');
    }

    function renderBlocks(blocks) {
      return blocks.map(function (block) {
        if (block.type === 'email') {
          return '<p>' + block.before + '<a href="mailto:' + email + '" class="email-highlight">' + email + '</a>' + block.after + '</p>';
        }
        return '<p>' + block.text + '</p>';
      }).join('');
    }

    function renderNav(sections) {
      return sections.map(function (section) {
        return '<h1><button type="button" data-section="' + section.id + '">' + section.nav + '</button></h1>';
      }).join('');
    }

    function renderActionBox(actionBox) {
      return '<h3>' + actionBox.title + '</h3>' + renderBlocks(actionBox.blocks);
    }

    function updateNavState(sectionId) {
      var nav = document.getElementById('section-nav');
      document.querySelectorAll('.main-text button').forEach(function (button) {
        button.classList.toggle('is-active', button.dataset.section === sectionId);
      });
      nav.classList.toggle('has-selection', !!sectionId);
      document.querySelector('.page-header').classList.toggle('is-hidden', !!sectionId);
    }

    function resetView() {
      activeSectionId = null;
      var panel = document.getElementById('content-panel');
      panel.innerHTML = '';
      panel.classList.remove('is-visible');
      document.getElementById('action-box').classList.remove('is-hidden');
      updateNavState(null);
    }

    function showSection(sectionId, sections) {
      var section = sections.find(function (item) {
        return item.id === sectionId;
      });
      if (!section) {
        return;
      }

      activeSectionId = sectionId;
      var panel = document.getElementById('content-panel');
      panel.innerHTML = renderParagraphs(section.paragraphs);
      panel.classList.add('is-visible');
      document.getElementById('action-box').classList.add('is-hidden');
      updateNavState(sectionId);
    }

    function bindNav(sections) {
      document.querySelectorAll('.main-text button').forEach(function (button) {
        button.addEventListener('click', function () {
          showSection(button.dataset.section, sections);
        });
      });
    }

    function bindOutsideClick() {
      document.body.addEventListener('click', function (event) {
        if (!activeSectionId) {
          return;
        }
        if (event.target.closest('.main-text, .content-panel, .action-box, .footer-row, .page-header')) {
          return;
        }
        resetView();
      });
    }

    function initPage() {
      document.getElementById('section-nav').innerHTML = renderNav(copy.sections);
      document.getElementById('action-box').innerHTML = renderActionBox(copy.actionBox);
      bindNav(copy.sections);
      bindOutsideClick();
    }

    initPage();
  </script>
</body>
